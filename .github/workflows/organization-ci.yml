name: Organization CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [devel]

permissions:
  contents: read

jobs:
  hygiene:
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-repository-hygiene.yml@v1
  python:
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-python-ci.yml@v1
    with:
      python-version: "3.13"
      install-command: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install -r test-requirements.txt
      check-command: python -m compileall plugins tests
